services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    # SEGURIDAD: PostgreSQL aislado en red interna (nunca expuesto a Internet)
    networks:
      - supabase_internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 10s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.164.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:?SUPABASE_PUBLIC_URL is required}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth

      GOTRUE_SITE_URL: ${SITE_URL:-https://sistema-de-gestion-para-negocios.vercel.app}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-https://sistema-de-gestion-para-negocios.vercel.app/**,https://*.github.io/**,http://localhost:3000/**}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET (min 32 chars) is required}
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: 'true'

      # Google OAuth 2.0 (Web + Móvil PKCE para iPhone, iPad, Android y Mac)
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${ENABLE_GOOGLE_AUTH:-true}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${SUPABASE_PUBLIC_URL}/auth/v1/callback

      # Correo Transaccional (Confirmación de cuenta & Recuperación de contraseña)
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: 'true'
      GOTRUE_MAILER_OTP_EXP: ${MAILER_OTP_EXP:-3600}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify

      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-no-reply@tu-dominio.com}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Smith Solutions}
      GOTRUE_SMTP_MAX_FREQUENCY: ${SMTP_MAX_FREQUENCY:-1m0s}
      GOTRUE_RATE_LIMIT_EMAIL_SENT: ${RATE_LIMIT_EMAIL_SENT:-30}
    networks:
      - supabase_internal
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 15s
      timeout: 5s
      retries: 5

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
    networks:
      - supabase_internal

  kong:
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      rest:
        condition: service_started
    expose:
      - '8000'
    ports:
      # SEGURIDAD TLS: Solo escucha en localhost/red Docker; el tráfico externo entra cifrado vía Coolify/Traefik HTTPS
      - '127.0.0.1:${KONG_HTTP_PORT:-8000}:8000'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /tmp/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      SUPABASE_ANON_KEY: ${ANON_KEY:?ANON_KEY is required}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY:?SERVICE_ROLE_KEY is required}
    volumes:
      - ./kong.yml:/var/lib/kong/kong.template.yml:ro
    entrypoint:
      - /bin/sh
      - -ec
      - |
        sed -e 's|$${SUPABASE_ANON_KEY}|'"$$SUPABASE_ANON_KEY"'|g' \
            -e 's|$${SUPABASE_SERVICE_KEY}|'"$$SUPABASE_SERVICE_KEY"'|g' \
            /var/lib/kong/kong.template.yml > /tmp/kong.yml
        export KONG_DECLARATIVE_CONFIG=/tmp/kong.yml
        exec /docker-entrypoint.sh kong docker-start
    networks:
      - supabase_internal
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  supabase_db_data:

networks:
  supabase_internal:
    driver: bridge
