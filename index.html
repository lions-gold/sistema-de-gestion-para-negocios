    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <script>
      // Force HTTPS in production environments if accessed via plain HTTP
      (function() {
        if (location.protocol === 'http:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1' && !location.hostname.endsWith('.local')) {
          location.replace('https:' + window.location.href.substring(window.location.protocol.length));
        }
      })();

      // Suppress Vite HMR WebSocket connection errors in sandbox iframe environment (HMR is disabled in AI Studio)
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason || '';
        var msg = String(reason.message || reason);
        var stack = String(reason.stack || '');
        if (msg.includes('WebSocket') || stack.includes('createWebSocketModuleRunnerTransport') || stack.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('error', function (e) {
        var msg = String(e.message || '');
        if (msg.includes('WebSocket') || msg.includes('@vite/client')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);
    </script>
